<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){try{var t=localStorage.getItem("toolkitapp_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/icon-32.png">
<title>Office ke PDF — Toolkit App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/tools.css">
</head>
<body class="mode-online">
<header class="top-rail">
  <div class="brand"><a href="app.html" class="back-link">←</a><span class="brand-mark"></span><span class="brand-name">Office ke PDF</span></div>
  <span class="tier-tag tier-online">🌐 butuh LibreOffice</span>
</header>
<main class="tool-shell">
  <div class="notice-box">Membutuhkan <strong>LibreOffice</strong> terinstal. Status tool: <span id="toolStatus">memeriksa…</span></div>
  <section class="tool-panel">
    <form id="form">
      <div class="dropzone" id="drop"><p id="dropLabel">Pilih .docx / .xlsx / .pptx / .odt</p>
        <input type="file" id="file" accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp" hidden></div>
      <ul class="file-list" id="fileList"></ul>
      <button class="btn-primary" id="btn" type="submit" style="margin-top:12px" disabled>Konversi ke PDF</button>
    </form>
  </section>
  <p class="status-line" id="statusLine"></p>
</main>
<script src="js/download-progress.js"></script>
<script src="js/page-transition.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
<script src="js/office-to-pdf.js"></script>
</body></html>
