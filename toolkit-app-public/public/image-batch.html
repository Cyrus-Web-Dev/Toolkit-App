<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){try{var t=localStorage.getItem("toolkitapp_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/icon-32.png">
<title>Kompres & Resize — Toolkit App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/tools.css"><link rel="stylesheet" href="css/bgremove.css">
</head>
<body class="mode-offline">
<header class="top-rail">
  <div class="brand"><a href="app.html" class="back-link">←</a><span class="brand-mark"></span><span class="brand-name">Kompres & Resize Gambar</span></div>
  <span class="tier-tag tier-offline">📴 offline</span>
</header>
<main class="tool-shell">
  <section class="tool-panel">
    <h2>Kompres & resize massal</h2>
    <div class="dropzone" id="ibDrop"><p>Seret banyak gambar sekaligus</p>
      <input type="file" id="ibFiles" accept="image/*" multiple hidden></div>
    <div class="field-row" style="margin-top:12px">
      <label>Lebar maks (px)<input class="text-input" type="number" id="ibW" value="1920"></label>
      <label>Tinggi maks (px)<input class="text-input" type="number" id="ibH" value="1920"></label>
    </div>
    <div class="field-row">
      <label>Kualitas (10–100)<input class="text-input" type="number" id="ibQ" value="80" min="10" max="100"></label>
      <label>Format
        <select class="select-input" id="ibFmt"><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="webp">WEBP</option></select>
      </label>
    </div>
    <div class="bg-actions" style="margin-top:12px">
      <button class="btn-primary" id="ibBtn" disabled>Proses Semua</button>
      <button class="btn-ghost" id="ibZip" disabled>Unduh Semua (.zip)</button>
    </div>
    <div class="bg-grid" id="ibGrid" style="margin-top:14px"></div>
  </section>
  <p class="status-line" id="statusLine"></p>
</main>
<script src="js/zip-lite.js"></script>
<script src="js/page-transition.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
<script src="js/download-progress.js"></script>
  <script src="js/image-batch.js"></script>
</body></html>
